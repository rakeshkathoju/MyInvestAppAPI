services:

  # 🌐 API Gateway (Node.js)
  api-gateway:
    build:
      context: ./api-gateway-node
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./api-gateway-node/.env
    depends_on:
      - trading-service
      - ai-service
      - user-service
    networks:
      - myinvest-network


  # 📊 Trading Service (Python + Neon DB)
  trading-service:
    build:
      context: ./trading-service-python
      dockerfile: Dockerfile
    ports:
      - "8001:8001"   # 🔥 external:internal
    env_file:
      - ./trading-service-python/.env   # ✅ VERY IMPORTANT
    networks:
      - myinvest-network


  # 🤖 AI Service (Python)
  ai-service:
    build:
      context: ./ai-service-python
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - myinvest-network


  # 👤 User Service (Java - Spring Boot)
  user-service:
    build:
      context: ./user-service-java
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - myinvest-network


  # 🤖 MCP Server (AI assistant tool interface)
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - API_GATEWAY_URL=http://api-gateway:3000
      - MCP_TRANSPORT=sse
      - MCP_PORT=8002
    depends_on:
      - api-gateway
    networks:
      - myinvest-network


# 🔗 Network
networks:
  myinvest-network:
    driver: bridge