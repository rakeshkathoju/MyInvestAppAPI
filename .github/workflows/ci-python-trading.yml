name: CI — Trading Service (Python)

on:
  push:
    branches: [main]
    paths:
      - 'trading-service-python/**'
      - '.github/workflows/ci-python-trading.yml'
  pull_request:
    branches: [main]
    paths:
      - 'trading-service-python/**'
      - '.github/workflows/ci-python-trading.yml'

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-service-python

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: trading-service-python/requirements.txt

      - name: Install flake8
        run: pip install flake8

      - name: Lint
        # E501: line too long (relaxed for data/trading scripts)
        # W503: line break before binary operator (style preference)
        run: flake8 . --exclude=data/ --max-line-length=120 --ignore=W503,E402

