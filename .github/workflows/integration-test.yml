name: Integration Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create stub env files
        # Provides required env vars so services start up.
        # DB-dependent services (trading) will report "database: disconnected"
        # but still return HTTP 200 — sufficient for a smoke test.
        run: |
          cat > api-gateway-node/.env <<'EOF'
          DATABASE_URL=postgresql://ci:ci@localhost/ci
          TRADING_SERVICE_URL=http://trading-service:8001
          AI_SERVICE_URL=http://ai-service:8000
          USER_SERVICE_URL=http://user-service:8081
          EOF

          cat > trading-service-python/.env <<'EOF'
          DATABASE_URL=postgresql://ci:ci@localhost/ci
          EOF

      - name: Build and start all services
        run: docker compose up -d --build

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          sleep 30

      - name: Health check — API Gateway (port 3000)
        run: |
          curl --fail --max-time 10 --retry 5 --retry-delay 5 \
            http://localhost:3000/health

      - name: Health check — Trading Service (port 8001)
        run: |
          curl --fail --max-time 10 --retry 5 --retry-delay 5 \
            http://localhost:8001/health

      - name: Health check — AI Service (port 8000)
        run: |
          curl --fail --max-time 10 --retry 5 --retry-delay 5 \
            http://localhost:8000/health

      - name: Health check — User Service (port 8081)
        run: |
          curl --fail --max-time 10 --retry 5 --retry-delay 5 \
            http://localhost:8081/users/health

      - name: Print container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down --volumes
